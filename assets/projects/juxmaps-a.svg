<svg viewBox="0 0 520 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <circle cx="260" cy="110" r="85" fill="#FFDCC2" opacity=".45"/>
  <g stroke="#1A1A1A" stroke-width="1.5" opacity=".35">
    <path d="M58 178 h12 M64 172 v12"/>
    <path d="M452 40 h12 M458 34 v12"/>
  </g>
  <defs>
    <clipPath id="jl"><rect x="140" y="40" width="120" height="140"/></clipPath>
    <clipPath id="jr"><rect x="260" y="40" width="120" height="140"/></clipPath>
  </defs>
  <!-- the sheet -->
  <rect x="140" y="40" width="240" height="140" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- THEN: hand-drawn old town, clipped left -->
  <g clip-path="url(#jl)">
    <rect x="140" y="40" width="120" height="140" fill="#FFDCC2"/>
    <!-- river -->
    <path d="M140 132 C 170 118, 196 140, 222 128 C 246 118, 262 130, 284 124" fill="none" stroke="#0E8C5A" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <!-- city wall -->
    <path d="M160 66 C 192 50, 236 52, 258 72 L258 110 C 240 116, 214 118, 190 110 C 168 104, 156 88, 160 66 Z" fill="none" stroke="#1A1A1A" stroke-width="2.2"/>
    <!-- wobbly streets -->
    <g fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round">
      <path d="M172 78 C 190 84, 206 78, 226 86 C 238 91, 246 96, 256 94"/>
      <path d="M198 58 C 200 74, 194 90, 204 108"/>
      <path d="M228 60 C 224 76, 232 92, 226 110"/>
      <path d="M166 96 C 184 100, 200 98, 218 104"/>
      <path d="M150 150 C 176 144, 198 158, 222 150 C 240 144, 250 152, 262 150"/>
      <path d="M186 130 C 190 140, 184 154, 192 168"/>
      <path d="M236 136 C 232 148, 240 160, 236 174"/>
    </g>
    <!-- church + gate -->
    <path d="M205 86 l6 -10 l6 10 z" fill="#FF7A29"/>
    <rect x="203" y="86" width="16" height="10" fill="#1A1A1A"/>
  </g>
  <!-- NOW: orthogonal grid, clipped right -->
  <g clip-path="url(#jr)">
    <g stroke="#1A1A1A" stroke-width="1.2" opacity=".55">
      <path d="M280 40 v140 M304 40 v140 M328 40 v140 M352 40 v140 M376 40 v140"/>
      <path d="M260 62 h120 M260 86 h120 M260 110 h120 M260 134 h120 M260 158 h120"/>
    </g>
    <!-- river, canalised -->
    <path d="M260 126 L 300 126 L 320 118 L 380 118" fill="none" stroke="#0E8C5A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <!-- same church, same place -->
    <path d="M205 86 l6 -10 l6 10 z" fill="#FF7A29"/>
    <!-- blocks -->
    <rect x="308" y="66" width="16" height="16" fill="#1A1A1A"/>
    <rect x="332" y="138" width="16" height="16" fill="#1A1A1A"/>
    <rect x="284" y="90" width="16" height="16" fill="#FFDCC2" stroke="#1A1A1A" stroke-width="1.5"/>
    <rect x="356" y="90" width="16" height="16" fill="#FFDCC2" stroke="#1A1A1A" stroke-width="1.5"/>
  </g>
  <!-- swipe handle -->
  <path d="M260 34 v152" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="260" cy="110" r="14" fill="#FF7A29" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M254 106 l-4 4 l4 4 M266 106 l4 4 l-4 4" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="SF Mono, IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#8a8d99">
    <text x="146" y="196">THEN · 1746</text>
    <text x="330" y="196">NOW · 2026</text>
    <text x="392" y="60">LDN · SWIPE</text>
  </g>
</svg>
