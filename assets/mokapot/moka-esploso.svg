<svg xmlns="http://www.w3.org/2000/svg" class="mk mk-esploso" viewBox="0 0 320 300" width="320" height="300" role="img" aria-labelledby="me-title me-desc">
<title id="me-title">Moka pot, exploded view</title>
<desc id="me-desc">A technical drawing of an orange octagonal Moka pot. Its three parts drift apart: the collector with its lid and black knob, the funnel holding the ground coffee, and the boiler with the water line. Dotted leaders name them in Italian; then the pot screws itself back together.</desc>
<style>
  /* Recolour: change these three (front face, left face, right face). Handle, knob, valve and funnel stay black and metal. */
  svg.mk-esploso { --body: #FF7A29; --side: #E66A1F; --shade: #C45816; }
  .me-body { fill: var(--body); } .me-side { fill: var(--side); } .me-shade { fill: var(--shade); }

  /* one ten-second timeline shared by every moving part: closed, open with labels for four seconds, closed again */
  .me-coll { animation: me-lift-coll 10s ease-in-out infinite; }
  .me-funl { animation: me-lift-funl 10s ease-in-out infinite; }
  .me-lab  { opacity: 0; animation: me-label 10s ease-in-out infinite; }
  @keyframes me-lift-coll {
    0%, 8%   { transform: translateY(0); }
    28%, 74% { transform: translateY(-72px); }
    92%, 100% { transform: translateY(0); }
  }
  @keyframes me-lift-funl {
    0%, 8%   { transform: translateY(0); }
    28%, 74% { transform: translateY(-34px); }
    92%, 100% { transform: translateY(0); }
  }
  @keyframes me-label {
    0%, 22% { opacity: 0; }
    32%, 72% { opacity: 1; }
    80%, 100% { opacity: 0; }
  }
  .me-t { font-family: "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: .08em; fill: #0E8C5A; }
  @media (prefers-reduced-motion: reduce) {
    /* still pose: open and labelled, so the parts stay explained */
    .me-coll { animation: none; transform: translateY(-72px); }
    .me-funl { animation: none; transform: translateY(-34px); }
    .me-lab  { animation: none; opacity: 1; }
  }
</style>

<g transform="translate(0,28)" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="120" cy="254" rx="62" ry="4.5" fill="#ECECE8" stroke="none"/>

  <!-- funnel with the coffee, hidden inside the pot when assembled -->
  <g class="me-funl">
    <path d="M93,160 Q120,148 147,160 Z" fill="#1A1A1A" stroke-width="1.5"/>
    <polygon points="92,160 148,160 143,174 97,174" fill="#FFFFFF"/>
    <path d="M99,167 H141" fill="none" stroke-width="1" stroke-dasharray="1.5 2.5" opacity=".6"/>
    <rect x="115" y="174" width="10" height="66" fill="#FFFFFF"/>
  </g>

  <!-- boiler (caldaia) -->
  <g>
    <!-- safety valve: neck and round cap, drawn behind the boiler so it emerges from the left edge -->
    <rect x="62" y="189.5" width="16" height="5" rx="1" fill="#FFFFFF" stroke-width="1.5"/>
    <ellipse cx="62" cy="192" rx="3" ry="4.8" fill="#FFFFFF" stroke-width="1.5"/>
    <polygon class="me-side" points="66,252 97.6,252 102.6,171 78,171" stroke="none"/>
    <polygon class="me-body" points="97.6,252 142.4,252 137.4,171 102.6,171" stroke="none"/>
    <polygon class="me-shade" points="142.4,252 174,252 162,171 137.4,171" stroke="none"/>
    <path d="M97.6,252 L102.6,171 M142.4,252 L137.4,171" fill="none" stroke-width="1.5" opacity=".45"/>
    <polygon points="66,252 174,252 162,171 78,171" fill="none"/>
    <path d="M69,246 H171" fill="none" stroke-width="1.5" opacity=".3"/>
  </g>

  <!-- collector, collar, spout, handle and lid move as one -->
  <g class="me-coll">
    <path fill-rule="evenodd" fill="#1A1A1A" d="M160,99 L195,99 Q201,100 200,107 L187,161 Q185,168 178,168 L158,168 Z M167,111 L185,112 Q189,113 188,118 L179,150 Q178,153 174,153 L164,153 Z"/>
    <rect class="me-body" x="76" y="152" width="88" height="19" stroke="none"/>
    <rect class="me-side" x="76" y="152" width="16" height="19" stroke="none"/>
    <rect class="me-shade" x="148" y="152" width="16" height="19" stroke="none"/>
    <rect x="76" y="152" width="88" height="19" fill="none"/>
    <path d="M76,156 H164" fill="none" stroke-width="1.2" opacity=".35"/>
    <polygon class="me-side" points="80,152 103.4,152 99.3,95 70,95" stroke="none"/>
    <polygon class="me-body" points="103.4,152 136.6,152 140.7,95 99.3,95" stroke="none"/>
    <polygon class="me-shade" points="136.6,152 160,152 170,95 140.7,95" stroke="none"/>
    <path d="M103.4,152 L99.3,95 M136.6,152 L140.7,95" fill="none" stroke-width="1.5" opacity=".45"/>
    <polygon points="80,152 160,152 170,95 70,95" fill="none"/>
    <polygon class="me-body" points="70,94 44,94 76,120"/>
    <polygon class="me-side" points="44,94 76,120 72,112" stroke="none"/>
    <path d="M44,94 L72,112" fill="none" stroke-width="1.5" opacity=".45"/>
    <rect class="me-body" x="68" y="91" width="104" height="5"/>
    <polygon class="me-side" points="72,91 100,91 105.5,76 85,76" stroke="none"/>
    <polygon class="me-body" points="100,91 140,91 134.5,76 105.5,76" stroke="none"/>
    <polygon class="me-shade" points="140,91 168,91 155,76 134.5,76" stroke="none"/>
    <path d="M100,91 L105.5,76 M140,91 L134.5,76" fill="none" stroke-width="1.5" opacity=".45"/>
    <polygon points="72,91 168,91 155,76 85,76" fill="none"/>
    <path d="M114,76 L109,56 Q109,52 113,52 L127,52 Q131,52 131,56 L126,76 Z" fill="#1A1A1A"/>
  </g>

  <!-- labels and leaders, drawn at the exploded positions -->
  <g class="me-lab" stroke-width="1.2" stroke-dasharray="2 3">
    <path d="M176,21 H212" fill="none"/>
    <path d="M151,133 H212" fill="none"/>
    <path d="M76,200 H212" fill="none" stroke-dasharray="3 3"/>
    <path d="M176,236 H212" fill="none"/>
    <g stroke="none">
      <text class="me-t" x="216" y="24">RACCOGLITORE</text>
      <text class="me-t" x="216" y="136">IMBUTO + CAFFÈ</text>
      <text class="me-t" x="216" y="203">ACQUA</text>
      <text class="me-t" x="216" y="239">CALDAIA</text>
    </g>
  </g>
</g>
</svg>
